# StarCam Gradle build tuning - local machine (Windows 8GB / 4 logical cores, 2026-09-01)
# Replaces the old 1.8GB Alibaba Cloud server conservative settings.
# NOTE: keep all property names/values ASCII (Java Properties uses ISO-8859-1).

org.gradle.caching=true
org.gradle.parallel=true
# Speed up configuration phase on subsequent builds (AGP 8.7 + Kotlin 2.0.21 compatible)
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Kotlin: use a dedicated compiler daemon (multi-threaded, CPU-bound).
# 8GB machine: keep daemon heaps moderate so Gradle+Kotlin+test workers coexist.
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx2g -XX:+UseParallelGC

# Gradle daemon heap: 8GB machine, enough for AGP + Kotlin + R8 without GC thrash.
# (Do NOT also set GRADLE_OPTS=-Dorg.gradle.jvmargs=... in env: it overrides this.)
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=640m -XX:+UseParallelGC

# 4 logical cores -> allow parallel workers (old 1.8GB box forced workers.max=1)
org.gradle.workers.max=4
