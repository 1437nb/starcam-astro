name: CI

# 回归自动化：任何 push / PR 都跑一遍纯 JVM 单测 + 凭据扫描。
# 本机历史上全靠手工执行「150 项 0 失败」，这个 workflow 把它变成硬保证。
#
# 注意：真值回归台（RealPhotoMatchTest / Photo12RegressionTest）依赖不入库的
# 真实照片素材（testdata/，含私拍原图），在 CI 里用 -PskipPhotoTests=true 跳过。
# 该 flag 只影响 CI；本机照常执行（那是宽场/暗星等修复的唯一真值保护）。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 不用 android-actions/setup-android：
      # 该 action 的 v3 会检测 runner 预装的 cmdline-tools 版本并跑
      # `sdkmanager tools`，在 ubuntu-latest 上以 exit code 1 失败
      # （实测日志：Wrong version in preinstalled sdkmanager）。
      # GitHub 的 ubuntu runner 本就预装 Android SDK（含 platform-34 与
      # build-tools），直接指向它即可，无需第三方 action。
      - name: Point Gradle at the preinstalled Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK = $SDK"
          ls "$SDK/platforms" "$SDK/build-tools" || true
          echo "sdk.dir=$SDK" > code/local.properties

      # gradlew 在仓库里（code/gradlew），无需额外安装 Gradle。
      # --rerun-tasks 必须保留：否则 Gradle 可能 FROM-CACHE 复用旧结果，
      # 等于没跑（AGENTS.md §2 记录的坑）。
      - name: Unit tests
        working-directory: code
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest \
            --rerun-tasks \
            -PskipPhotoTests=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            code/app/build/reports/tests/testDebugUnitTest/
            code/app/build/test-results/testDebugUnitTest/
          retention-days: 14

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 防止 nova API key 那类凭据再次进入公开历史。
      - name: Scan for leaked credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
