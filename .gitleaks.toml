# gitleaks 配置：在默认规则集之上补充本项目的凭据形态。
#
# 为什么需要：默认规则只匹配「已知凭据格式」（AWS AKIA…、GitHub ghp_…、
# Slack xox…、私钥块等）。「自定义变量名 = 任意口令」这类通用赋值不在其中
# （上游为控制误报率刻意不覆盖），而本项目的辅助脚本正是这种写法，
# 所以必须显式补规则，否则扫描会静默放行。
#
# 规则三条：口令字面量 / 带凭据语境的服务器地址 / root 账户赋值。
# 白名单放过占位符与示例写法，避免误报。

[extend]
# 保留默认规则集（已知凭据格式仍照常告警）
useDefault = true

[[rules]]
id = "starcam-ssh-credential"
description = "SSH/服务器口令硬编码"
# 变量名含 pass/pwd/secret + 赋值为长度 ≥6 的字符串字面量。
# 注意：字符类里必须显式排除 \r\n —— 否则 `"password="` 这种**字符串字面量**
# 的引号会与下一行的引号配对，把两行正文糊成一次"赋值"匹配（实测误报 3 处）。
# 占位符（your_password_here / REDACTED / * / ${VAR}）在下方 allowlist 放行。
regex = '''(?i)[\w.]*(pass(word|wd)?|pwd|secret)[\w]*\s*[:=]\s*["'][^"'$\{\s\r\n][^"'\r\n]{5,}["']'''
tags = ["credential", "ssh"]
[rules.allowlist]
# 允许「明显是占位/示例/读取环境变量/路径」的写法
regexes = [
  # 占位符：your_*/changeme/placeholder/xxx/REDACTED/***
  '''(?i)[\w.]*(pass(word|wd)?|pwd|secret)[\w]*\s*[:=]\s*["'][^"'\r\n]*(your|changeme|placeholder|redacted|example|dummy|fake|todo|xxx|\*\*\*)[^"'\r\n]*["']''',
  # 读取环境变量/配置，非字面量
  '''(?i)[\w.]*(pass(word|wd)?|pwd|secret)[\w]*\s*[:=]\s*\w+\.get(env|Property)''',
  # 解析 "password=" 这类字符串字面量（git credential 协议），不是凭据本身
  '''(?i)(?:startswith|endswith|contains|equals|indexOf)\s*\(\s*["'][\w.]*(pass|pwd|secret)[\w.]*["']''',
  # URL 路径/接口名（如 forgot_password_url = "/auth/reset"）——值以 / 开头
  '''(?i)[\w.]*(pass(word|wd)?|pwd|secret)[\w]*\s*[:=]\s*["']/''',
  # 单字符或纯符号（掩码、正则片段）
  '''(?i)[\w.]*(pass(word|wd)?|pwd|secret)[\w]*\s*[:=]\s*["'][^"'\w]{0,5}["']''',
]

[[rules]]
id = "starcam-server-ip-with-credential"
description = "公网 IP 与 SSH/凭据语境同现"
# 单独的地址字面量不算凭据（版本号 17.0.20.1 之类会误报，文档里也有示例 IP）。
# 只有地址与 host/ssh 等配置语境出现在同一行时才告警，避免噪声。
#
# 注意：gitleaks 用 RE2 引擎，**不支持 lookahead/lookbehind**（`(?!...)` 会让
# gitleaks 启动即 panic）。因此排除私有网段改用下面的 allowlist.regexes 表达。
regex = '''(?i)(?:ssh_?host|ssh_?server|host|server|ip)\s*[:=]\s*["']\d{1,3}(?:\.\d{1,3}){3}["']'''
tags = ["infrastructure", "credential"]
[rules.allowlist]
# 私有/回环/链路本地网段不算泄露（RE2 里没有 lookahead，只能在这里排除）
regexes = [
  '''(?i)(?:host|server|ip)\s*[:=]\s*["'](?:10\.|127\.|192\.168\.|172\.(?:1[6-9]|2\d|3[01])\.|169\.254\.|0\.)''',
  # 文档/示例里常见的占位地址
  '''(?i)(?:host|server|ip)\s*[:=]\s*["'](?:1\.2\.3\.4|8\.8\.8\.8|example|your|xxx|\*+)''',
]

[[rules]]
id = "starcam-ssh-root-line"
description = "SSH 配置行里的 root 账户"
regex = '''(?i)\b(ssh_?user|username|user)\s*[:=]\s*["']root["']'''
tags = ["credential", "ssh"]

# 全局白名单：这些路径不算泄露
[allowlist]
paths = [
  # 测试夹具与示例
  '''.*(test|spec|fixture|example|sample).*''',
  # gitleaks 自身配置（规则里必然出现这些关键字）
  '''\.gitleaks\.toml$''',
]
