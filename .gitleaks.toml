# gitleaks 配置（2026-09-20 事故后新增）
#
# 事故：tools/gh_socks_tunnel.py 里硬编码 SSH_PASS = "<真实口令>" 与服务器 IP，
# 提交到公开仓库后暴露 2 天。CI 里的 gitleaks 每次都报 success —— 因为它走的是
# **默认规则集**，而默认规则只匹配「已知凭据格式」（AWS AKIA…、GitHub ghp_…、
# Slack xox…、私钥块等）。「自定义变量名 = 任意口令」这种通用赋值不在其中
# （上游为控制误报率刻意不覆盖）。
#
# 本配置在默认规则之上补三条项目专属规则 + 白名单，覆盖我们的实际踩坑形态。

title = "StarCam gitleaks config"

[extend]
# 保留默认规则集（已知凭据格式仍照常告警）
useDefault = true

[[rules]]
id = "starcam-ssh-credential"
description = "SSH/服务器口令硬编码"
# 变量名含 pass/pwd/secret + 赋值为长度 ≥6 的字符串字面量。
# 注意：占位符（your_password_here / REDACTED / * / ${VAR}）在下方 allowlist 放行。
regex = '''(?i)[\w.]*(pass(word|wd)?|pwd|secret)[\w]*\s*[:=]\s*["'][^"'$\{\s][^"']{5,}["']'''
tags = ["credential", "ssh"]
[rules.allowlist]
# 允许「明显是占位/示例/读取环境变量/路径」的写法
regexes = [
  # 占位符：your_*/changeme/placeholder/xxx/REDACTED/***
  '''(?i)[\w.]*(pass(word|wd)?|pwd|secret)[\w]*\s*[:=]\s*["'][^"']*(your|changeme|placeholder|redacted|example|dummy|fake|todo|xxx|\*\*\*)[^"']*["']''',
  # 读取环境变量/配置，非字面量
  '''(?i)[\w.]*(pass(word|wd)?|pwd|secret)[\w]*\s*[:=]\s*\w+\.get(env|Property)''',
  # URL 路径/接口名（如 forgot_password_url = "/auth/reset"）——值以 / 开头
  '''(?i)[\w.]*(pass(word|wd)?|pwd|secret)[\w]*\s*[:=]\s*["']/''',
  # 单字符或纯符号（掩码、正则片段）
  '''(?i)[\w.]*(pass(word|wd)?|pwd|secret)[\w]*\s*[:=]\s*["'][^"'\w]{0,5}["']''',
]

[[rules]]
id = "starcam-server-ip-with-credential"
description = "公网 IP 与 SSH/凭据语境同现"
# 单独的 IP 字面量不算泄露（版本号 17.0.20.1 之类会误报，文档里也有示例 IP）。
# 只有 IP 与 root/ssh/password 等凭据语境出现在**同一行**时才告警 ——
# 本次事故的形态正是 SSH_HOST = "<公网IP>" 与 SSH_PASS 相邻。
regex = '''(?i)(?:ssh_?host|host|server|ip)\s*[:=]\s*["'](?!10\.|127\.|192\.168\.|172\.(?:1[6-9]|2\d|3[01])\.)\d{1,3}(?:\.\d{1,3}){3}["']'''
tags = ["infrastructure", "credential"]

[[rules]]
id = "starcam-ssh-root-line"
description = "SSH 配置行里的 root 账户"
regex = '''(?i)\b(ssh_?user|username|user)\s*[:=]\s*["']root["']'''
tags = ["credential", "ssh"]

# 全局白名单：这些路径里的内容不算泄露
[allowlist]
paths = [
  # 测试夹具与示例
  '''.*(test|spec|fixture|example|sample).*''',
  # 本仓库的脱敏文档（明示凭据处理历史）
  '''docs/.*''',
  # gitleaks 自身配置
  '''\.gitleaks\.toml$''',
]
