# StarCam Gradle build tuning - high performance development machine
# NOTE: keep all property names/values ASCII (Java Properties uses ISO-8859-1).

org.gradle.caching=true
org.gradle.parallel=true
# Speed up configuration phase on subsequent builds (AGP 8.7 + Kotlin 2.0.21 compatible)
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Kotlin: use a dedicated compiler daemon (multi-threaded, CPU-bound).
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx3g -XX:+UseParallelGC

# Gradle daemon heap: enough for AGP + Kotlin + R8 without GC thrash.
# (Do NOT also set GRADLE_OPTS=-Dorg.gradle.jvmargs=... in env: it overrides this.)
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -XX:+UseParallelGC

# Parallel workers tuning for multi-core system
org.gradle.workers.max=8
